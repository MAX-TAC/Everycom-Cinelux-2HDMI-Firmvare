name: Audit KuSettings service migration from verified stock OTA
on:
  push:
    branches: [tvsettingsplus-migration-v0]
    paths:
      - ".github/workflows/audit-tvsettingsplus-service-migration.yml"
      - "tools/audit_kusettings_migration_services.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils unzip
          mkdir -p /tmp/jadx-bin /tmp/dumper /tmp/images /tmp/erofs /tmp/jadx
          curl -fL --retry 4 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          curl -fL --retry 4 https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz -o /tmp/dumper.tar.gz
          tar -xzf /tmp/dumper.tar.gz -C /tmp/dumper
      - name: Verify original OTA and extract official APKs read-only
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/OTA_Updates/RJMT9660_firmware_8052.zip -o /tmp/ota.zip
          echo 'bedea70fbf3f08d3c18e59d5f91e7d12828c77fac314c30fcc98332c32c88e35  /tmp/ota.zip' | sha256sum -c -
          DUMPER="$(find /tmp/dumper -type f -name 'payload-dumper-go*' | head -n 1)"
          chmod +x "$DUMPER"
          "$DUMPER" -c 3 -p system,system_ext -o /tmp/images /tmp/ota.zip > /tmp/dump.log 2>&1
          for part in system system_ext; do
            mkdir -p "/tmp/erofs/$part"
            fsck.erofs --extract="/tmp/erofs/$part" "/tmp/images/$part.img" > "/tmp/extract-$part.log" 2>&1
          done
      - name: Decompile the four targeted OEM APKs
        run: |
          set -euo pipefail
          for app in KuSettings KuSetupWizard KuSourceRJ TvSettingsPlus; do
            APK="$(find /tmp/erofs -type f -name "$app.apk" -print -quit)"
            test -n "$APK" && test -s "$APK"
            echo "$app: original OEM APK validated (hash below)"
            sha256sum "$APK"
            mkdir -p "/tmp/jadx/$app"
            /tmp/jadx-bin/bin/jadx --no-res -j 2 -d "/tmp/jadx/$app" "$APK" >/tmp/jadx-$app.log 2>&1 || {
              echo "JADX partial warnings for $app:"
              tail -n 12 "/tmp/jadx-$app.log"
            }
          done
      - name: Produce call summary without exporting OEM source code
        run: |
          python3 -u tools/audit_kusettings_migration_services.py --jadx /tmp/jadx --out /tmp/audit
          test -s /tmp/audit/kusettings_service_calls.json
          head -n 110 /tmp/audit/kusettings_service_calls_RU.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinelux-8052-kusettings-service-call-audit
          path: /tmp/audit/
          if-no-files-found: ignore
          retention-days: 30
