name: Read-only RUIOS 8052 OTA boot chain and AVB metadata
on:
  push:
    branches: [stock-8052-8054-deep-audit-20261021]
    paths:
      - ".github/workflows/ota-bootchain-static.yml"
      - "tools/audit_ota_bootchain_metadata.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-bootchain:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned payload dumper
        run: |
          mkdir -p /tmp/dumper /tmp/images
          curl -fL --retry 4 https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz -o /tmp/pd.tar.gz
          tar -xzf /tmp/pd.tar.gz -C /tmp/dumper
      - name: Retrieve verified stock OTA image
        run: |
          curl -fL --retry 4 "https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/OTA_Updates/RJMT9660_firmware_8052.zip" -o /tmp/ota.zip
          echo "bedea70fbf3f08d3c18e59d5f91e7d12828c77fac314c30fcc98332c32c88e35  /tmp/ota.zip" | sha256sum -c -
      - name: Inspect only boot chain partitions without flash
        run: |
          BIN="$(find /tmp/dumper -type f -name 'payload-dumper-go*' | head -n 1)"
          chmod +x "$BIN"
          "$BIN" -c 3 -p boot,mboot,optee,vbmeta,vbmeta_system,dtbo,armfw -o /tmp/images /tmp/ota.zip > /tmp/dump.log 2>&1 || { tail -n 60 /tmp/dump.log; exit 1; }
          python3 -u tools/audit_ota_bootchain_metadata.py --images /tmp/images --out analysis/Stock_8052_8054_Deep_Audit
          head -n 85 analysis/Stock_8052_8054_Deep_Audit/bootchain_ota_metadata.md
      - name: Commit public metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/Stock_8052_8054_Deep_Audit/bootchain_ota_metadata.*
          if ! git diff --cached --quiet; then
            git commit -m "Audit signed 8052 OTA bootchain headers and AVB metadata"
            git pull --rebase origin stock-8052-8054-deep-audit-20261021
            git push origin HEAD:stock-8052-8054-deep-audit-20261021
          fi
