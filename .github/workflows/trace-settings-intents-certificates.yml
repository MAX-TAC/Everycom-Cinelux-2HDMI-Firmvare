name: Trace Android TV Settings OEM dispatch and APK signatures

on:
  push:
    branches: [global-firmware-map-8052-8054-20261021]
    paths:
      - ".github/workflows/trace-settings-intents-certificates.yml"
      - "tools/audit_settings_dispatch_and_certificates.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Android APK tools and filesystem support
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils aapt apksigner unzip
          curl -fL --retry 4 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx-bin /tmp/dumper /tmp/images /tmp/erofs
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          curl -fL --retry 4 "https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz" -o /tmp/payload.tar.gz
          tar -xzf /tmp/payload.tar.gz -C /tmp/dumper
      - name: Verify and extract original October 8052 OTA files
        run: |
          curl -fL --retry 5 --retry-delay 4 "https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/OTA_Updates/RJMT9660_firmware_8052.zip" -o /tmp/ota.zip
          echo "bedea70fbf3f08d3c18e59d5f91e7d12828c77fac314c30fcc98332c32c88e35  /tmp/ota.zip" | sha256sum -c -
          BIN="$(find /tmp/dumper -type f -name 'payload-dumper-go*' | head -n 1)"
          chmod +x "$BIN"
          "$BIN" -c 3 -p system,system_ext,vendor -o /tmp/images /tmp/ota.zip > /tmp/payload.log 2>&1 || { tail -n 65 /tmp/payload.log; exit 1; }
          for name in system system_ext vendor; do
            mkdir -p "/tmp/erofs/$name"
            fsck.erofs --extract="/tmp/erofs/$name" "/tmp/images/$name.img" > "/tmp/$name.log" 2>&1 || { tail -n 70 "/tmp/$name.log"; exit 1; }
          done
      - name: Audit Settings manifests signing and Java callsites
        run: |
          python3 -u tools/audit_settings_dispatch_and_certificates.py > /tmp/settings-analyze.log 2>&1 || { tail -n 90 /tmp/settings-analyze.log; exit 1; }
          tail -n 40 /tmp/settings-analyze.log
          head -n 115 analysis/Global_Firmware_Map_20261021/SETTINGS_DISPATCH_8052_RU.md
      - name: Publish only source-free results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/Global_Firmware_Map_20261021/SETTINGS_DISPATCH_8052_RU.md analysis/Global_Firmware_Map_20261021/SETTINGS_DISPATCH_8052_EVIDENCE.json
          if ! git diff --cached --quiet; then
            git commit -m "Trace OEM Settings dispatch and Android certificate trust on verified stock OTA"
            git pull --rebase origin global-firmware-map-8052-8054-20261021
            git push origin HEAD:global-firmware-map-8052-8054-20261021
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-dispatch-audit
          path: analysis/Global_Firmware_Map_20261021/SETTINGS_DISPATCH_8052*
          retention-days: 30
