name: Build shared Custom v0 FLauncher and Android TV Settings shortcut
on:
  push:
    branches: [custom-v0-staging-8052-8054-20261021]
    paths:
      - ".github/workflows/custom-v0-common-apks.yml"
      - "custom-v0/shortcut/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and verify Android SDK
        run: |
          set -euxo pipefail
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign openjdk-17-jdk-headless unzip
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"/platforms
          ls "$ANDROID_HOME"/build-tools
      - name: Download pinned upstream FLauncher 0.18.0 and validate source identity
        run: |
          set -euxo pipefail
          mkdir -p /tmp/custom-apks
          curl -fL --retry 5 --retry-delay 3             https://gitlab.com/flauncher/flauncher/-/releases/0.18.0/downloads/flauncher-0.18.0.apk             -o /tmp/custom-apks/FLauncher.apk
          echo "36e13a97d92dbfa038f5af3976b05d86ea504ed664dd2ed0a21f3b560ce19cb4  /tmp/custom-apks/FLauncher.apk" | sha256sum -c -
          aapt dump badging /tmp/custom-apks/FLauncher.apk | grep -m 1 "package: name='me.efesser.flauncher'"
          unzip -tq /tmp/custom-apks/FLauncher.apk | tail -n 2
          apksigner verify --print-certs /tmp/custom-apks/FLauncher.apk | head -n 8
      - name: Build and sign nonprivileged Settings shortcut APK
        run: |
          set -euxo pipefail
          WORK=/tmp/custom-shortcut
          mkdir -p "$WORK/classes" "$WORK/dex"
          SDK="$ANDROID_HOME/platforms/android-33/android.jar"
          test -f "$SDK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d -name '3[5-6]*' | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/d8"
          aapt package -f -M custom-v0/shortcut/AndroidManifest.xml             -S custom-v0/shortcut/res -I "$SDK" -F "$WORK/resources.apk"
          javac -source 8 -target 8 -classpath "$SDK" -d "$WORK/classes"             custom-v0/shortcut/src/org/cinelux/settingsshortcut/OpenSettingsActivity.java
          "$BUILD_TOOLS/d8" --min-api 23 --lib "$SDK" --output "$WORK/dex"             "$WORK/classes/org/cinelux/settingsshortcut/OpenSettingsActivity.class"
          cd "$WORK"
          cp resources.apk unsigned.apk
          aapt add unsigned.apk dex/classes.dex
          zipalign -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -alias cine-sandbox -keyalg RSA -keysize 3072 -validity 730             -dname "CN=CineLux Developer Test Shortcut, OU=Experimental, O=Open Source, C=US"             -keystore "$WORK/sandbox.keystore" -storepass changeit -keypass changeit -noprompt
          apksigner sign --ks "$WORK/sandbox.keystore" --ks-pass pass:changeit             --key-pass pass:changeit --out /tmp/custom-apks/CineLuxSettingsShortcut.apk aligned.apk
          apksigner verify --print-certs /tmp/custom-apks/CineLuxSettingsShortcut.apk | head -n 12
          aapt dump badging /tmp/custom-apks/CineLuxSettingsShortcut.apk | head -n 22
          echo 'This SettingsShortcut APK has an EPHEMERAL development signature. Do not distribute as a permanent install; updates require a stable dedicated signing key.' > /tmp/custom-apks/README_SIGNING.txt
      - name: Publish real APK files as a GitHub Actions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinelux-custom-v0-common-apks
          path: /tmp/custom-apks/
          if-no-files-found: error
          retention-days: 30
