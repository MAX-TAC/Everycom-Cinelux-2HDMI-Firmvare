name: Deep compare CineLux OEM APK implementations
on:
  push:
    paths:
      - "tools/apk_deep_compare.py"
      - ".github/workflows/deep-apk-comparison.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install offline binary analysis tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar openssl lz4 file e2fsprogs erofs-utils aapt unzip
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          mkdir -p /tmp/apk-variants
      - name: Extract just the target APKs from both stock firmware images
        run: |
          set -e
          for variant in one two; do
            mkdir -p /tmp/source /tmp/source/unpack /tmp/pieces /tmp/logical /tmp/unpacked
            if [ "$variant" = one ]; then
              url="https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/Original_Firmware_for_1_HDMI_ports/4K.HDMI-.-20260813.1.rar"
              sha="bff981a9d440d1495bd6ab48a72fb13c4572de69fcbe81448fc117a3bba5f30f"
              script="analysis/One_HDMI/upgrade_script.txt"
            else
              url="https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/Original_Firmware/4KTOF.HDMI-.-DPLS.-09.30.rar"
              sha="170f745dc1711c2dae6410dd51f0a8bf5bb7c637e11b8dd3e5f59fbea8c388f3"
              script="analysis/Original_Firmware/decrypted/upgrade_script.txt"
            fi
            curl -fL --retry 5 --retry-delay 3 "$url" -o /tmp/source/source.rar
            echo "$sha  /tmp/source/source.rar" | sha256sum -c
            unar -q -o /tmp/source/unpack /tmp/source/source.rar
            python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          p=Path('/tmp/source/unpack/upgrade_image.pkg')
          h=p.open('rb').read(4096)
          start=int(re.search(rb'REE_OFFSET_START\s*=\s*0x([0-9a-fA-F]+)',h).group(1),16)
          length=int(re.search(rb'REE_OFFSET_LEN\s*=\s*0x([0-9a-fA-F]+)',h).group(1),16)
          with p.open('rb') as f,open('/tmp/source/decrypted.bin','wb') as o:
              f.seek(start)
              proc=subprocess.Popen(['openssl','enc','-d','-aes-256-cbc','-nopad',
                '-K','d43ba86d31b3bd0091ef13b8e1e0ac912a88c5fe593f8e401b44976d6d04322f',
                '-iv','00000000000000000000000000000000'],stdin=subprocess.PIPE,stdout=o)
              remaining=length
              while remaining:
                  buf=f.read(min(remaining,4*1024*1024))
                  if not buf:raise EOFError('encrypted input truncated')
                  proc.stdin.write(buf);remaining-=len(buf)
              proc.stdin.close()
              assert proc.wait()==0
          PY
            python3 tools/reconstruct_cinelux.py /tmp/source/decrypted.bin /tmp/pieces "$script" /tmp/reconstruction > /tmp/parse.log 2>&1 || { tail -n 30 /tmp/parse.log; exit 1; }
            git clone -q https://github.com/soe1hom-arch/lpunpack-go.git /tmp/lpunpack-go
            (cd /tmp/lpunpack-go && go build -o /tmp/lpunpack .)
            /tmp/lpunpack /tmp/pieces/super.img /tmp/logical > /tmp/lpunpack.log 2>&1
            for part in system_a system_ext_a vendor_a; do
              mkdir -p "/tmp/unpacked/$part"
              fsck.erofs --extract="/tmp/unpacked/$part" "/tmp/logical/$part.img" > "/tmp/$part.log" 2>&1
            done
            mkdir -p "/tmp/apk-variants/$variant"
            python3 - "$variant" <<'PY'
          import sys,shutil
          from pathlib import Path
          src=Path('/tmp/unpacked')
          dst=Path('/tmp/apk-variants')/sys.argv[1]
          wanted={'KuSettings','KeystoneCorrection','RuiAutoFocus','KuSourceRJ','trdservice','trdmiddle',
          'TvSettingsPlus','zxlauncher','zxstore','LiveTV','TvServices','Factory','KuSetupWizard','Provision','RuiYunOta'}
          for f in src.rglob('*.apk'):
              if f.stem in wanted:
                  target=dst/f.relative_to(src)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(f,target)
          print(sys.argv[1],[(f.name,f.stat().st_size) for f in dst.rglob('*.apk')],flush=True)
          PY
            rm -rf /tmp/source /tmp/pieces /tmp/logical /tmp/unpacked /tmp/lpunpack-go /tmp/reconstruction
            df -h /tmp
          done
      - name: Decompile and compare app-level interfaces and methods
        run: |
          python3 -u tools/apk_deep_compare.py \
            /tmp/apk-variants/one /tmp/apk-variants/two analysis/HDMI_Comparison/APK_Deep > /tmp/decompile-comparison.log 2>&1
          tail -n 90 /tmp/decompile-comparison.log
          head -n 120 analysis/HDMI_Comparison/APK_Deep/README.md
      - name: Commit concise code comparison
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/HDMI_Comparison/APK_Deep/
          if ! git diff --cached --quiet; then
            git commit -m "Compare CineLux OEM apps at decompiled class and permission level"
            git pull --rebase origin main
            git push origin main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinelux-oem-apk-deep-diff
          path: analysis/HDMI_Comparison/APK_Deep/
          if-no-files-found: warn
          retention-days: 30
