name: Test TvSettingsPlus migration manifest patch
on:
  push:
    branches: [tvsettingsplus-migration-v0]
    paths:
      - ".github/workflows/test-tvsettingsplus-manifest.yml"
      - "tools/patch_tvsettingsplus_manifest.py"
      - "tests/test_patch_tvsettingsplus_manifest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install XML parser
        run: python -m pip install lxml
      - name: Compile and test patcher
        run: |
          python -m py_compile tools/patch_tvsettingsplus_manifest.py
          python -m unittest discover -s tests -p 'test_patch_tvsettingsplus_manifest.py' -v
