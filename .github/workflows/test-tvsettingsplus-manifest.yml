name: Test TvSettingsPlus migration manifest patch
on:
  push:
    branches: [tvsettingsplus-migration-v0]
    paths:
      - ".github/workflows/test-tvsettingsplus-manifest.yml"
      - "tools/patch_tvsettingsplus_manifest.py"
      - "tests/test_patch_tvsettingsplus_manifest.py"
      - "tvsettingsplus-mod/src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install XML parser
        run: python -m pip install lxml
      - name: Compile and test patcher
        run: |
          python -m py_compile tools/patch_tvsettingsplus_manifest.py
          python -m unittest discover -s tests -p 'test_patch_tvsettingsplus_manifest.py' -v
      - name: Compile staged TvSettingsPlus Java activities against Android SDK
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/platforms/android-34/android.jar"
          test -s "$SDK"
          mkdir -p /tmp/tvsettingsplus-compile
          javac -source 8 -target 8 -classpath "$SDK" -d /tmp/tvsettingsplus-compile tvsettingsplus-mod/src/com/android/tv/settings/cinelux/*.java
          find /tmp/tvsettingsplus-compile -type f -name '*.class' | sort
