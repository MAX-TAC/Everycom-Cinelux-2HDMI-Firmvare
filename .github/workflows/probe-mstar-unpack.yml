name: Test MStar BIN unpack against CineLux PKG

on:
  push:
    paths:
      - ".github/workflows/probe-mstar-unpack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install RAR extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unar git
      - name: Retrieve verified PKG
        run: |
          mkdir -p /tmp/fw
          curl -fL --retry 5 --retry-delay 5 \
            "https://github.com/MAX-TAC/Everycom-Cinelux-2HDMI-Firmvare/releases/download/Original_Firmware/4KTOF.HDMI-.-DPLS.-09.30.rar" -o /tmp/source.rar
          echo "170f745dc1711c2dae6410dd51f0a8bf5bb7c637e11b8dd3e5f59fbea8c388f3  /tmp/source.rar" | sha256sum --check
          unar -q -o /tmp/fw /tmp/source.rar
          ln -s upgrade_image.pkg /tmp/fw/upgrade_image.bin
          sha256sum /tmp/fw/upgrade_image.*
      - name: Fetch original MStar unpacker
        run: |
          git clone --quiet https://github.com/dipcore/mstar-bin-tool.git /tmp/mstar-bin-tool
          git -C /tmp/mstar-bin-tool checkout --quiet edd1a54cd5531ee98b82378ceeff9a246aced064
      - name: Test original unpack.py on renamed PKG
        run: |
          mkdir -p analysis/Original_Firmware/mstar_probe
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          p=Path('/tmp/fw/upgrade_image.bin')
          h=p.open('rb').read(16*1024)
          first_ff=h.find(bytes([255]))
          results=[
              '# MStar unpacker test on CineLux firmware',
              'The unchanged upgrade_image.pkg was accessed under the name upgrade_image.bin using a symlink.',
              'Tool: dipcore/mstar-bin-tool commit edd1a54cd5531ee98b82378ceeff9a246aced064.',
              'The tool expects a 16 KiB header with a readable MStar command script.',
              'First FF delimiter offset: '+str(first_ff),
              'Initial 80 bytes (hex): '+h[:80].hex(" "),
          ]
          try:
              h[:first_ff].decode('utf-8')
              results+=['Pre-delimiter header decodes as UTF-8: yes']
          except UnicodeDecodeError as ex:
              results+=['Pre-delimiter header decodes as UTF-8: NO, '+str(ex)]
          try:
              def limit():
                  import resource
                  resource.setrlimit(resource.RLIMIT_FSIZE,(64*1024*1024,64*1024*1024))
              r=subprocess.run([sys.executable,'/tmp/mstar-bin-tool/unpack.py',str(p),'/tmp/mstar-output'],
                               cwd='/tmp/mstar-bin-tool',capture_output=True,text=True,errors='replace',
                               timeout=35,preexec_fn=limit)
              results+=['Original unpack.py exit code: '+str(r.returncode),'STDOUT:',r.stdout[-6000:],'STDERR:',r.stderr[-6000:]]
          except Exception as ex:
              results+=['Probe error: '+str(ex)]
          outputs=[str(x) for x in Path('/tmp/mstar-output').rglob('*') if x.is_file()] if Path('/tmp/mstar-output').exists() else []
          results+=['Extracted output files: '+str(outputs[:20])]
          f=Path('analysis/Original_Firmware/mstar_probe/README.md')
          f.write_text('\n'.join(results)+'\n',encoding='utf8')
          print(f.read_text()[:12000])
          PY
      - name: Commit bounded report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/Original_Firmware/mstar_probe/README.md
          if ! git diff --cached --quiet; then
            git commit -m "Test original MStar unpacker on renamed CineLux PKG"
            git pull --rebase origin main
            git push origin main
          fi
