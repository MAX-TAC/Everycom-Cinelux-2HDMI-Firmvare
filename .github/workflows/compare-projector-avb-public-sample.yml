name: Compare 8052 AVB fingerprint with public HY300 projector stock vbmeta

on:
  push:
    paths:
      - ".github/workflows/compare-projector-avb-public-sample.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download 1 MiB vbmeta image from public Chinese projector reverse-engineering repo
        run: |
          mkdir -p /tmp/projector
          curl -fL --retry 4 https://raw.githubusercontent.com/BruBread/ProjectorRoot/main/backups/vbmeta_orig.img -o /tmp/projector/hy300_rk3326_vbmeta.img
          test "$(stat -c %s /tmp/projector/hy300_rk3326_vbmeta.img)" -eq 1048576
      - name: Calculate comparable AVB public key hash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('/tmp/projector/hy300_rk3326_vbmeta.img')
          raw=p.read_bytes()
          stock='dcf38badcd7784d2aa892739eba5e239a649362edb03586a455b3f8ded046cfe'
          res={'device':'Magcubic HY300 (Rockchip RK3326)', 'source':'BruBread/ProjectorRoot/backups/vbmeta_orig.img', 'image_bytes':len(raw), 'key_sha256_from_everycom_8052_8054':stock}
          at=raw.find(b'AVB0')
          res['avb0_offset']=at
          if at>=0 and len(raw)>=at+256:
              v=raw[at:]
              auth=int.from_bytes(v[12:20],'big');aux=int.from_bytes(v[20:28],'big')
              key_offset=int.from_bytes(v[64:72],'big');key_size=int.from_bytes(v[72:80],'big')
              res['avb_algorithm_id']=int.from_bytes(v[28:32],'big')
              res['public_key_length']=key_size
              if 0<key_size<8193 and key_offset+key_size<=aux and 256+auth+aux<=len(v):
                  key=v[256+auth+key_offset:256+auth+key_offset+key_size]
                  res['public_key_sha256']=hashlib.sha256(key).hexdigest()
                  res['matches_everycom_key']=res['public_key_sha256']==stock
              else:
                  res['comment']='No valid public key slice'
          else:
              res['comment']='AVB0 not found'
          root=Path('analysis/AVB_Key_Research_20261021');root.mkdir(parents=True,exist_ok=True)
          (root/'other_projector_vbmeta_comparison.json').write_text(json.dumps(res,indent=2)+'\n')
          print(json.dumps(res,indent=2))
          PY
      - name: Publish read-only public projector sample fingerprint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/AVB_Key_Research_20261021/other_projector_vbmeta_comparison.json
          if ! git diff --cached --quiet; then
            git commit -m "Compare public RK3326 Chinese projector vbmeta key to 8052/8054"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
