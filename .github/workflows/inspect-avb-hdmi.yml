name: Inspect verified boot and PKG signing metadata

on:
  push:
    paths:
      - ".github/workflows/inspect-avb-hdmi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        variant: [one, two]
    steps:
      - uses: actions/checkout@v4
      - name: Download package and inspect AVB signature mode
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq && sudo apt-get install -y -qq unar lz4 openssl file
          mkdir -p /tmp/avb /tmp/avb/rar
          if [ "$VARIANT" = "one" ]; then
            URL="https://github.com/MAX-TAC/Everycom-Cinelux-2HDMI-Firmvare/releases/download/Original_Firmware_for_1_HDMI_ports/4K.HDMI-.-20260813.1.rar"
            SHA="bff981a9d440d1495bd6ab48a72fb13c4572de69fcbe81448fc117a3bba5f30f"
          else
            URL="https://github.com/MAX-TAC/Everycom-Cinelux-2HDMI-Firmvare/releases/download/Original_Firmware/4KTOF.HDMI-.-DPLS.-09.30.rar"
            SHA="170f745dc1711c2dae6410dd51f0a8bf5bb7c637e11b8dd3e5f59fbea8c388f3"
          fi
          curl -fL --retry 5 "$URL" -o /tmp/avb/source.rar
          echo "$SHA  /tmp/avb/source.rar" | sha256sum -c
          unar -q -o /tmp/avb/rar /tmp/avb/source.rar
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,re,struct,json
          flavor=os.environ['VARIANT']
          script=Path('analysis/One_HDMI/upgrade_script.txt' if flavor=='one' else 'analysis/Original_Firmware/decrypted/upgrade_script.txt').read_text()
          lines=script.splitlines()
          sample=[]
          for i,line in enumerate(lines):
              if not line.startswith('filepartload '):continue
              following=[]
              for next_line in lines[i+1:]:
                  if next_line.startswith('filepartload '):break
                  following.append(next_line)
              for part in ('vbmeta_a','vbmeta_system_a'):
                  if any(('partition write mmc 0 '+part+' ') in ln for ln in following):
                      t=line.split()
                      sample.append((part,int(t[4],16),int(t[3],16)))
          assert len(sample)==2,sample
          print('AVB images',sample)
          p=Path('/tmp/avb/rar/upgrade_image.pkg')
          maximum=max(start+sz for _,start,sz in sample)
          with p.open('rb') as f:
              f.seek(0x1000)
              inp=f.read(maximum-0x1000+32)
          inp=inp[:len(inp)//16*16]
          dec=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-nopad',
             '-K','d43ba86d31b3bd0091ef13b8e1e0ac912a88c5fe593f8e401b44976d6d04322f',
             '-iv','00000000000000000000000000000000'],
             input=inp,capture_output=True,check=True).stdout
          results={'variant':flavor,'avb_images':[]}
          for part,start,size in sample:
              compressed=Path('/tmp/avb/'+part+'.lz4')
              compressed.write_bytes(dec[start-0x1000:start-0x1000+size])
              outfile=Path('/tmp/avb/'+part+'.img')
              subprocess.run(['lz4','-d','-q',str(compressed),str(outfile)],check=True)
              head=outfile.open('rb').read(256)
              assert head[:4]==b'AVB0', head[:16].hex()
              obj={'partition':part,'size':outfile.stat().st_size,
                   'header_version_major':int.from_bytes(head[4:8],'big'),
                   'header_version_minor':int.from_bytes(head[8:12],'big'),
                   'auth_block_size':int.from_bytes(head[12:20],'big'),
                   'aux_block_size':int.from_bytes(head[20:28],'big'),
                   'algorithm_type':int.from_bytes(head[28:32],'big'),
                   'public_key_offset':int.from_bytes(head[64:72],'big'),
                   'public_key_size':int.from_bytes(head[72:80],'big'),
                   'rollback_index':int.from_bytes(head[112:120],'big'),
                   'flags':int.from_bytes(head[120:124],'big'),
                   'rollback_index_location':int.from_bytes(head[124:128],'big')}
              import hashlib
              with outfile.open('rb') as fkey:
                  fkey.seek(256+obj['auth_block_size']+obj['public_key_offset'])
                  pub=fkey.read(obj['public_key_size'])
              obj['public_key_sha256']=hashlib.sha256(pub).hexdigest()
              obj['public_key_found']=len(pub)==obj['public_key_size']
              results['avb_images'].append(obj)
          Path('/tmp/avb/report.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avb-hdmi-${{ matrix.variant }}
          path: /tmp/avb/report.json
          retention-days: 30

  publish:
    needs: avb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: avb-hdmi-*
          path: /tmp/avb-report
      - name: Compare AVB headers
        run: |
          mkdir -p analysis/HDMI_Comparison
          python3 - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('/tmp/avb-report/avb-hdmi-one/report.json').read_text())
          two=json.loads(Path('/tmp/avb-report/avb-hdmi-two/report.json').read_text())
          rows=['# AVB (vbmeta) comparison','',
            'Info extracted directly from stock vendor images. This is NOT verification that the bootloader is unlocked.',
            '',
            '| Partition | 1 HDMI algorithm ID | 2 HDMI algorithm ID | 1 HDMI auth size | 2 HDMI auth size |',
            '|---|---:|---:|---:|---:|']
          for a,b in zip(one['avb_images'],two['avb_images']):
              rows.append('| '+a['partition']+' | '+str(a['algorithm_type'])+' | '+str(b['algorithm_type'])+
                ' | '+str(a['auth_block_size'])+' | '+str(b['auth_block_size'])+' |')
          rows+=['','## Stock public signing keys and verified boot flags','',
            '| Partition | Public-key SHA256 1 HDMI | Public-key SHA256 2 HDMI | Same key? | Flags (1/2) | Rollback index (1/2) |',
            '|---|---|---|---|---|---|']
          for a,b in zip(one['avb_images'],two['avb_images']):
              rows.append('| '+a['partition']+' | '+a['public_key_sha256']+' | '+b['public_key_sha256']+
                ' | '+str(a['public_key_sha256']==b['public_key_sha256'])+' | '+str(a['flags'])+'/'+str(b['flags'])+' | '+
                str(a['rollback_index'])+'/'+str(b['rollback_index'])+' |')
          rows+=['','AVB algorithm ID 0 means NONE. Other IDs refer to cryptographic signature algorithms and require matching trusted keys.',
              'Stock PKG wrapper signatures are independent of AVB metadata.']
          Path('analysis/HDMI_Comparison/AVB.md').write_text('\n'.join(rows)+'\n')
          print('\n'.join(rows))
          PY
      - name: Commit AVB report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/HDMI_Comparison/AVB.md
          if ! git diff --cached --quiet; then
            git commit -m "Inspect stock CineLux AVB algorithm settings for both HDMI variants"
            git pull --rebase origin main
            git push origin main
          fi
