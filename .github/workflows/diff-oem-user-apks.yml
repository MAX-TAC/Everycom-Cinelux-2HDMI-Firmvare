name: Deep diff latest launcher store and setup APKs versus 8054

on:
  push:
    branches: [deep-stock-audit-8052-8054-20261021]
    paths:
      - ".github/workflows/diff-oem-user-apks.yml"
      - "tools/diff_8052_8054_launcher_store_setup.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  compare-app-code:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Java decompiler and EROFS tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils unzip
          curl -fL --retry 4 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx-bin /tmp/dumper /tmp/images /tmp/erofs/system
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          curl -fL --retry 4 https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz -o /tmp/dumper.tar.gz
          tar -xzf /tmp/dumper.tar.gz -C /tmp/dumper
      - name: Get verified factory 8054 JADX metadata
        uses: actions/download-artifact@v4
        with:
          name: cinelux-apk-methods-two
          run-id: 39421706994
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/deep-8054
      - name: Verify latest 8052 OTA and extract APKs
        run: |
          curl -fL --retry 5 --retry-delay 4 "https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/OTA_Updates/RJMT9660_firmware_8052.zip" -o /tmp/ota.zip
          echo "bedea70fbf3f08d3c18e59d5f91e7d12828c77fac314c30fcc98332c32c88e35  /tmp/ota.zip" | sha256sum -c -
          BIN="$(find /tmp/dumper -type f -name 'payload-dumper-go*' | head -n 1)"
          chmod +x "$BIN"
          "$BIN" -c 3 -p system -o /tmp/images /tmp/ota.zip > /tmp/payload.log 2>&1 || { tail -n 80 /tmp/payload.log; exit 1; }
          fsck.erofs --extract="/tmp/erofs/system" /tmp/images/system.img > /tmp/erofs.log 2>&1 || { tail -n 80 /tmp/erofs.log; exit 1; }
      - name: Compare only modified application method bodies
        run: |
          python3 -u tools/diff_8052_8054_launcher_store_setup.py > /tmp/appmethods.log 2>&1 || { tail -n 100 /tmp/appmethods.log; exit 1; }
          tail -n 30 /tmp/appmethods.log
          head -n 80 analysis/Deep_Stock_Audit_20261021/LAUNCHER_STORE_SETUP_METHODS_RU.md
      - name: Publish only method and manifest metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/Deep_Stock_Audit_20261021/LAUNCHER_STORE_SETUP_METHODS_RU.md analysis/Deep_Stock_Audit_20261021/latest_8052_vs_8054_launcher_store_setup_methods.json
          if ! git diff --cached --quiet; then
            git commit -m "Classify changed OEM launcher store and setup methods across stock versions"
            git pull --rebase origin deep-stock-audit-8052-8054-20261021
            git push origin HEAD:deep-stock-audit-8052-8054-20261021
          fi
