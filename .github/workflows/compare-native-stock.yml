name: Compare ELF code 8052 October vs 8054 September
on:
  push:
    branches: [deep-stock-audit-8052-8054-20261021]
    paths:
      - ".github/workflows/compare-native-stock.yml"
      - "tools/inspect_stock_native_sections.py"
      - "tools/read_verified_factory_ree.py"
      - "tools/compare_stock_native_sections.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [ota8052, stock8054]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar lz4 openssl file e2fsprogs erofs-utils unzip python3-pip
          python3 -m pip install --break-system-packages pyelftools==0.32 capstone==5.0.6
          mkdir -p /tmp/native/source /tmp/native/original /tmp/native/parts /tmp/native/logical /tmp/native/erofs /tmp/native/report /tmp/native/extracted
      - name: Verify, decrypt and unpack factory 8054
        if: matrix.variant == 'stock8054'
        run: |
          curl -fL --retry 5 --retry-delay 4 "https://github.com/MAX-TAC/Everycom-Cinelux-2HDMI-Firmvare/releases/download/Original_Firmware/4KTOF.HDMI-.-DPLS.-09.30.rar" -o /tmp/native/original/source.rar
          echo "170f745dc1711c2dae6410dd51f0a8bf5bb7c637e11b8dd3e5f59fbea8c388f3  /tmp/native/original/source.rar" | sha256sum -c -
          unar -q -o /tmp/native/extracted /tmp/native/original/source.rar
          python3 tools/read_verified_factory_ree.py --pkg /tmp/native/extracted/upgrade_image.pkg --out /tmp/native/source/plain.bin
          python3 -u tools/reconstruct_cinelux.py /tmp/native/source/plain.bin /tmp/native/parts analysis/Original_Firmware/decrypted/upgrade_script.txt /tmp/native/report/reconstruction > /tmp/native/reconstruction.log 2>&1 || { tail -n 70 /tmp/native/reconstruction.log; exit 1; }
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/native/report/reconstruction/segments.json"))
          assert not d["errors"],d["errors"]
          assert d["super"]["size"]==d["super"]["expected_gpt_super_size"]
          PY
          git clone -q https://github.com/soe1hom-arch/lpunpack-go.git /tmp/lpunpack-go
          (cd /tmp/lpunpack-go && go build -o /tmp/lpunpack .)
          /tmp/lpunpack -v /tmp/native/parts/super.img /tmp/native/logical > /tmp/native/lpunpack.log 2>&1 || { tail -n 80 /tmp/native/lpunpack.log; exit 1; }
      - name: Verify and unpack October 8052 OTA
        if: matrix.variant == 'ota8052'
        run: |
          curl -fL --retry 5 --retry-delay 4 "https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/OTA_Updates/RJMT9660_firmware_8052.zip" -o /tmp/native/source/ota.zip
          echo "bedea70fbf3f08d3c18e59d5f91e7d12828c77fac314c30fcc98332c32c88e35  /tmp/native/source/ota.zip" | sha256sum -c -
          curl -fL --retry 4 "https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz" -o /tmp/native/dumper.tar.gz
          mkdir -p /tmp/native/dumper
          tar -xzf /tmp/native/dumper.tar.gz -C /tmp/native/dumper
          BIN="$(find /tmp/native/dumper -type f -name 'payload-dumper-go*' | head -n 1)"
          chmod +x "$BIN"
          "$BIN" -c 3 -p system,system_ext,vendor,product -o /tmp/native/logical /tmp/native/source/ota.zip > /tmp/native/payload.log 2>&1 || { tail -n 90 /tmp/native/payload.log; exit 1; }
          for name in system system_ext vendor product; do
            if test -s "/tmp/native/logical/$name.img"; then
              mv "/tmp/native/logical/$name.img" "/tmp/native/logical/$name""_a.img"
            fi
          done
      - name: Extract Android partitions and fingerprint ELF
        run: |
          for name in system_a system_ext_a vendor_a product_a; do
            IMG="/tmp/native/logical/$name.img"
            if test -s "$IMG"; then
              mkdir -p "/tmp/native/erofs/$name"
              fsck.erofs --extract="/tmp/native/erofs/$name" "$IMG" > /tmp/native/extract.log 2>&1 || { tail -n 80 /tmp/native/extract.log; exit 1; }
            fi
          done
          python3 -u tools/inspect_stock_native_sections.py --root /tmp/native/erofs --variant ${{ matrix.variant }} --out /tmp/native/report/${{ matrix.variant }}.json > /tmp/native/elf.log 2>&1 || { tail -n 80 /tmp/native/elf.log; exit 1; }
          tail -n 20 /tmp/native/elf.log
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.variant }}
          path: /tmp/native/report/${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 30
  compare:
    needs: inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: /tmp/native-data
      - name: Compare code bytes and ABI dependencies
        run: |
          python3 -u tools/compare_stock_native_sections.py --ota /tmp/native-data/ota8052.json --stock /tmp/native-data/stock8054.json
          head -n 65 analysis/Deep_Stock_Audit_20261021/NATIVE_8052_OTA_VS_8054_RU.md
      - name: Commit source-free report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/Deep_Stock_Audit_20261021/NATIVE_8052_OTA_VS_8054_RU.md analysis/Deep_Stock_Audit_20261021/native_ota8052_vs_stock8054.json
          if ! git diff --cached --quiet; then
            git commit -m "Compare latest OTA and factory native code"
            git pull --rebase origin deep-stock-audit-8052-8054-20261021
            git push origin HEAD:deep-stock-audit-8052-8054-20261021
          fi
