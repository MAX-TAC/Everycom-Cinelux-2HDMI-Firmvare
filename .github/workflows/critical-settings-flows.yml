name: Audit critical OEM first boot and projector settings methods

on:
  push:
    branches: [settings-wizard-debloat-audit-20261021]
    paths:
      - ".github/workflows/critical-settings-flows.yml"
      - "tools/audit_critical_oem_method_flows.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  methods:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install JADX and EROFS tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils unzip
          mkdir -p /tmp/jadx-bin /tmp/dumper /tmp/images /tmp/erofs
          curl -fL --retry 4 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          curl -fL --retry 4 https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz -o /tmp/dumper.tar.gz
          tar -xzf /tmp/dumper.tar.gz -C /tmp/dumper
      - name: Download SHA verified October OTA and extract original APKs
        run: |
          curl -fL --retry 5 --retry-delay 3 https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/OTA_Updates/RJMT9660_firmware_8052.zip -o /tmp/ota.zip
          echo "bedea70fbf3f08d3c18e59d5f91e7d12828c77fac314c30fcc98332c32c88e35  /tmp/ota.zip" | sha256sum -c -
          BIN="$(find /tmp/dumper -type f -name 'payload-dumper-go*' | head -n 1)"
          chmod +x "$BIN"
          "$BIN" -c 3 -p system,system_ext -o /tmp/images /tmp/ota.zip >/tmp/payload.log 2>&1 || { tail -n 65 /tmp/payload.log; exit 1; }
          for part in system system_ext; do
            mkdir -p "/tmp/erofs/$part"
            fsck.erofs --extract="/tmp/erofs/$part" "/tmp/images/$part.img" >/tmp/$part.log 2>&1 || { tail -n 80 /tmp/$part.log; exit 1; }
          done
      - name: Extract method-side-effect and error handling indicators
        run: |
          python3 -u tools/audit_critical_oem_method_flows.py > /tmp/methods.log 2>&1 || { tail -n 100 /tmp/methods.log; exit 1; }
          cat /tmp/methods.log
          head -n 70 analysis/Settings_Wizard_Debloat_20261021/CRITICAL_METHOD_FLOWS_RU.md
      - name: Commit metadata-only results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/Settings_Wizard_Debloat_20261021/CRITICAL_METHOD_FLOWS_RU.md analysis/Settings_Wizard_Debloat_20261021/critical_method_flow_indicators.json
          if ! git diff --cached --quiet; then
            git commit -m "Record critical OEM first boot projector HDMI and settings method side effects"
            git pull --rebase origin settings-wizard-debloat-audit-20261021
            git push origin HEAD:settings-wizard-debloat-audit-20261021
          fi
