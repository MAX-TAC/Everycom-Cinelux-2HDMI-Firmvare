name: Inventory actual October 8052 init services OEM permissions and remote keys
on:
  push:
    branches: [global-firmware-map-8052-8054-20261021]
    paths:
      - ".github/workflows/audit-ota8052-platform-integration.yml"
      - "tools/audit_ota8052_system_integration.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install payload and read-only filesystem utilities
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils unzip
          mkdir -p /tmp/dumper /tmp/images /tmp/erofs
          curl -fL --retry 4 "https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz" -o /tmp/payload.tar.gz
          tar -xzf /tmp/payload.tar.gz -C /tmp/dumper
      - name: Download and SHA-verify stock 8052 October OTA
        run: |
          curl -fL --retry 5 --retry-delay 4 "https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/OTA_Updates/RJMT9660_firmware_8052.zip" -o /tmp/ota8052.zip
          echo "bedea70fbf3f08d3c18e59d5f91e7d12828c77fac314c30fcc98332c32c88e35  /tmp/ota8052.zip" | sha256sum -c -
          BIN="$(find /tmp/dumper -type f -name 'payload-dumper-go*' | head -n 1)"
          chmod +x "$BIN"
          "$BIN" -c 3 -p system,system_ext,vendor,product -o /tmp/images /tmp/ota8052.zip > /tmp/payload.log 2>&1 || { tail -n 60 /tmp/payload.log; exit 1; }
          for name in system system_ext vendor product; do
            if test -s "/tmp/images/$name.img"; then
              mkdir -p "/tmp/erofs/$name"
              fsck.erofs --extract="/tmp/erofs/$name" "/tmp/images/$name.img" > /tmp/$name.log 2>&1 || { tail -n 65 "/tmp/$name.log"; exit 1; }
            fi
          done
      - name: List init services OEM permissions keylayouts and overlays
        run: |
          python3 -u tools/audit_ota8052_system_integration.py > /tmp/inventory.log 2>&1 || { tail -n 85 /tmp/inventory.log; exit 1; }
          cat /tmp/inventory.log
          head -n 80 analysis/Global_Firmware_Map_20261021/OTA8052_INIT_PERMISSIONS_KEYLAYOUT_RU.md
      - name: Commit read-only metadata and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/Global_Firmware_Map_20261021/OTA8052_INIT_PERMISSIONS_KEYLAYOUT_RU.md analysis/Global_Firmware_Map_20261021/ota8052_init_permissions_keylayout.json
          if ! git diff --cached --quiet; then
            git commit -m "Map original latest 8052 OTA Android startup services permission grants and keymaps"
            git pull --rebase origin global-firmware-map-8052-8054-20261021
            git push origin HEAD:global-firmware-map-8052-8054-20261021
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota8052-system-integration-audit
          path: analysis/Global_Firmware_Map_20261021/
          retention-days: 30
