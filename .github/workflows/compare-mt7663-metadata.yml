name: Compare verified MT7663 WiFi module metadata

on:
  push:
    branches: [stock-custom-architecture-8052-8054-20261021]
    paths:
      - ".github/workflows/compare-mt7663-metadata.yml"
      - "tools/compare_mt7663_driver_provenance.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  module-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download original native artifacts together
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          run-id: 39574844708
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/native-versions
      - name: Compare module code and vermagic/depends
        run: |
          python3 tools/compare_mt7663_driver_provenance.py
          head -n 95 analysis/Stock_Custom_Architecture_20261021/MT7663_DRIVER_COMPARISON_RU.md
      - name: Publish original-module evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/Stock_Custom_Architecture_20261021/MT7663_DRIVER_COMPARISON_RU.md analysis/Stock_Custom_Architecture_20261021/mt7663_module_metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "Document MT7663 module version and code section deltas"
            git pull --rebase origin stock-custom-architecture-8052-8054-20261021
            git push origin HEAD:stock-custom-architecture-8052-8054-20261021
          fi
