name: Deep diff RUIOS 8052 versus 8053 DTS and board settings

on:
  push:
    branches: [ota-hardware-profiles-20261020]
    paths:
      - ".github/workflows/deep-diff-ruios-8052-8053.yml"
      - "tools/inspect_ruios_deep_profile.py"
      - "tools/compare_ruios_deep_profiles.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { code: "8052", sha: "bedea70fbf3f08d3c18e59d5f91e7d12828c77fac314c30fcc98332c32c88e35" }
          - { code: "8053", sha: "9ca8276448e79587b82e55cec0cf3da55154b750774f608378f64619c84f556b" }
    steps:
      - uses: actions/checkout@v4
      - name: Install static read-only dtc and ext4 tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler e2fsprogs xz-utils
          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz -o /tmp/pd.tar.gz
          mkdir -p /tmp/pd /tmp/images /tmp/hardware
          tar -xzf /tmp/pd.tar.gz -C /tmp/pd
      - name: Download and SHA256-verify official OTA ZIP
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/OTA_Updates/RJMT9660_firmware_${{ matrix.code }}.zip" \
            -o /tmp/source.zip
          echo "${{ matrix.sha }}  /tmp/source.zip" | sha256sum -c -
      - name: Extract only DTBO and hardware config partitions
        run: |
          BIN="$(find /tmp/pd -type f -name 'payload-dumper-go*' | head -n 1)"
          chmod +x "$BIN"
          "$BIN" -c 3 -p dtbo,tvconfig,bootdata -o /tmp/images /tmp/source.zip \
             > /tmp/pd.log 2>&1 || { tail -n 100 /tmp/pd.log; exit 1; }
          ls -l /tmp/images
          python3 -u tools/inspect_ruios_deep_profile.py \
            --code ${{ matrix.code }} --images /tmp/images --out /tmp/hardware
      - uses: actions/upload-artifact@v4
        with:
          name: ruios-deep-config-${{ matrix.code }}
          path: /tmp/hardware/
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ruios-deep-config-*
          merge-multiple: true
          path: /tmp/deep-ota-data
      - name: Generate DTS and OEM board diff with whole-build comparison
        run: python3 -u tools/compare_ruios_deep_profiles.py
      - name: Commit structured report to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/RUIOS_8052_vs_8053_Deep/
          if ! git diff --cached --quiet; then
            git commit -m "Compare actual DTS nodes and OEM board configs for OTA 8052 vs 8053"
            git pull --rebase origin ota-hardware-profiles-20261020
            git push origin HEAD:ota-hardware-profiles-20261020
          fi
