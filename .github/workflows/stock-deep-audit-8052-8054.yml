name: Static OEM 8052-8054 deep audit
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install offline analysis tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip erofs-utils e2fsprogs aapt file python3-pyelftools
          mkdir -p /tmp/dumper /tmp/jadx-bin /tmp/images /tmp/erofs /tmp/parts /tmp/audit
          curl -fL --retry 4 https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz -o /tmp/pd.tar.gz
          tar -xzf /tmp/pd.tar.gz -C /tmp/dumper
          curl -fL --retry 4 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          python3 -c 'from elftools.elf.elffile import ELFFile'
      - name: Download SHA256 verified 8052 OTA
        run: |
          curl -fL --retry 5 --retry-delay 3 "https://github.com/MAX-TAC/Everycom-Cinelux-Firmware/releases/download/OTA_Updates/RJMT9660_firmware_8052.zip" -o /tmp/ota8052.zip
          echo "bedea70fbf3f08d3c18e59d5f91e7d12828c77fac314c30fcc98332c32c88e35  /tmp/ota8052.zip" | sha256sum -c -
      - name: Extract official OTA partitions read-only
        run: |
          BIN="$(find /tmp/dumper -type f -name 'payload-dumper-go*' | head -n 1)"
          chmod +x "$BIN"
          "$BIN" -c 3 -o /tmp/images /tmp/ota8052.zip > /tmp/payload.log 2>&1 || { tail -n 50 /tmp/payload.log; exit 1; }
          for NAME in system system_ext vendor product; do
            test -s "/tmp/images/$NAME.img"
            mkdir -p "/tmp/erofs/$NAME"_a
            fsck.erofs --extract="/tmp/erofs/$NAME"_a "/tmp/images/$NAME.img" > "/tmp/$NAME.log" 2>&1 || { tail -n 50 "/tmp/$NAME.log"; exit 1; }
          done
      - name: Retrieve factory 8054 machine code hashes
        uses: actions/download-artifact@v4
        with:
          name: cinelux-native-two
          run-id: 39422365902
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/stock-native
      - name: Retrieve factory 8054 partition hashes
        uses: actions/download-artifact@v4
        with:
          name: cinelux-variant-two
          run-id: 39422365902
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/stock-partitions
      - name: Retrieve factory 8054 Java method hashes
        uses: actions/download-artifact@v4
        with:
          name: cinelux-apk-methods-two
          run-id: 39421706994
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/stock-apps
      - name: Compare machine code, runtime libraries and boot partitions
        run: |
          python3 -u tools/audit_native_config.py /tmp/erofs /tmp/parts 8052-ota /tmp/audit/ota-native.json
          python3 -u tools/audit_latest_native_against_8054.py --ota-native /tmp/audit/ota-native.json --stock-native /tmp/stock-native/native.json --ota-images /tmp/images --stock-manifest /tmp/stock-partitions/manifest.json --out analysis/Stock_8052_8054_Deep_Audit
          head -n 70 analysis/Stock_8052_8054_Deep_Audit/native_diff.md
      - name: Inspect OEM APK bytecode, dependencies and suspicious behavior
        run: |
          python3 -u tools/deep_apk_methods.py /tmp/erofs /tmp/audit/ota-apps.json ota > /tmp/apps.log 2>&1 || { tail -n 70 /tmp/apps.log; exit 1; }
          tail -n 25 /tmp/apps.log
          python3 -u tools/audit_oem_app_impact.py --ota /tmp/audit/ota-apps.json --factory /tmp/stock-apps/deep-apks.json --erofs /tmp/erofs --out analysis/Stock_8052_8054_Deep_Audit
          head -n 50 analysis/Stock_8052_8054_Deep_Audit/app_impact.md
      - name: Commit technical metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/Stock_8052_8054_Deep_Audit
          if ! git diff --cached --quiet; then
            git commit -m "Compare OEM native and Java method differences; triage application dependencies"
            git pull --rebase origin stock-8052-8054-deep-audit-20261021
            git push origin HEAD:stock-8052-8054-deep-audit-20261021
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-8052-8054-native-app-audit
          path: analysis/Stock_8052_8054_Deep_Audit/
          if-no-files-found: warn
          retention-days: 30
