name: Identify OTA build versions in CineLux firmware

on:
  push:
    paths:
      - ".github/workflows/scan-cinelux-versions.yml"
      - "tools/inspect_cinelux_versions.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [one, two]
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only firmware utilities
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar lz4 openssl file e2fsprogs erofs-utils aapt
          df -h /tmp
      - name: Download the official archive and verify SHA256
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p /tmp/source /tmp/source/extracted /tmp/parts /tmp/erofs /tmp/logical /tmp/audit
          if [ "$VARIANT" = "one" ]; then
            URL="https://github.com/MAX-TAC/Everycom-Cinelux-2HDMI-Firmvare/releases/download/Original_Firmware_for_1_HDMI_ports/4K.HDMI-.-20260813.1.rar"
            SHA="bff981a9d440d1495bd6ab48a72fb13c4572de69fcbe81448fc117a3bba5f30f"
          else
            URL="https://github.com/MAX-TAC/Everycom-Cinelux-2HDMI-Firmvare/releases/download/Original_Firmware/4KTOF.HDMI-.-DPLS.-09.30.rar"
            SHA="170f745dc1711c2dae6410dd51f0a8bf5bb7c637e11b8dd3e5f59fbea8c388f3"
          fi
          curl -fL --retry 5 --retry-delay 4 "$URL" -o /tmp/source/source.rar
          echo "$SHA  /tmp/source/source.rar" | sha256sum -c -
          unar -q -o /tmp/source/extracted /tmp/source/source.rar
          ls -lh /tmp/source/extracted
      - name: Verify secure REE header and decrypt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          p=Path('/tmp/source/extracted/upgrade_image.pkg')
          h=p.open('rb').read(4096)
          a=re.search(rb'REE_OFFSET_START\s*=\s*0x([0-9A-Fa-f]+)',h)
          b=re.search(rb'REE_OFFSET_LEN\s*=\s*0x([0-9A-Fa-f]+)',h)
          assert a and b,'Not known secure MTK layout'
          start=int(a.group(1),16);length=int(b.group(1),16)
          assert start==4096 and length%16==0 and length<p.stat().st_size and h[0x500:0x508]==b'MTK.....'
          print('Decrypting REE payload:',length,'bytes starting at',start,flush=True)
          with p.open('rb') as source,open('/tmp/source/decrypted.bin','wb') as output:
              source.seek(start)
              process=subprocess.Popen(['openssl','enc','-d','-aes-256-cbc','-nopad',
                 '-K','d43ba86d31b3bd0091ef13b8e1e0ac912a88c5fe593f8e401b44976d6d04322f',
                 '-iv','00000000000000000000000000000000'],stdin=subprocess.PIPE,stdout=output,stderr=subprocess.PIPE)
              remains=length
              while remains:
                  data=source.read(min(remains,8*1024*1024))
                  if not data:raise EOFError('Incomplete encrypted data')
                  process.stdin.write(data)
                  remains-=len(data)
              process.stdin.close()
              rc=process.wait()
              assert rc==0,'AES decryption failed'
          plain=Path('/tmp/source/decrypted.bin')
          assert plain.stat().st_size==length,'Decrypted body size differs'
          header=plain.open('rb').read(32768)
          assert b'gpt create mmc 0' in header and b'filepartload' in header,'Key did not decode MStar script'
          print('Verified decrypted MStar script')
          PY
      - name: Reconstruct physical and Android logical partitions
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "one" ]; then
            SCRIPT="analysis/One_HDMI/upgrade_script.txt"
          else
            SCRIPT="analysis/Original_Firmware/decrypted/upgrade_script.txt"
          fi
          python3 -u tools/reconstruct_cinelux.py \
            /tmp/source/decrypted.bin /tmp/parts "$SCRIPT" /tmp/audit/segment-report \
            > /tmp/audit/reconstruction.log 2>&1
          tail -n 12 /tmp/audit/reconstruction.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('/tmp/audit/segment-report/segments.json').read_text())
          if o['errors']:raise RuntimeError('Partition reconstruction errors: '+str(o['errors']))
          a=o['super']
          assert a['size']==a['expected_gpt_super_size'],'Reconstructed super size mismatch'
          print('Valid reconstructed super:',a['size'])
          PY
          git clone -q https://github.com/soe1hom-arch/lpunpack-go.git /tmp/lpunpack-go
          cd /tmp/lpunpack-go
          go build -o /tmp/lpunpack .
          /tmp/lpunpack -v /tmp/parts/super.img /tmp/logical > /tmp/audit/lpunpack.log 2>&1
          file /tmp/logical/*.img
          test -s /tmp/logical/system_a.img
          test -s /tmp/logical/vendor_a.img
          df -h /tmp
      - name: Extract EROFS Android filesystems
        run: |
          for img in /tmp/logical/*.img; do
            [ -f "$img" ] || continue
            if file -b "$img" | grep -q EROFS; then
              name="$(basename "$img" .img)"
              mkdir -p "/tmp/erofs/$name"
              fsck.erofs --extract="/tmp/erofs/$name" "$img" > "/tmp/audit/$name-extract.log" 2>&1
            fi
          done
          du -sh /tmp/erofs/* || true
      - name: Inventory OTA version markers in stock images
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p "/tmp/audit/versions/$VARIANT"
          python3 -u tools/inspect_cinelux_versions.py \
            /tmp/erofs /tmp/parts "$VARIANT" "/tmp/audit/versions/$VARIANT"
          sed -n '1,90p' "/tmp/audit/versions/$VARIANT/README.md"
      - uses: actions/upload-artifact@v4
        with:
          name: cinelux-ota-metadata-${{ matrix.variant }}
          path: /tmp/audit/versions/
          retention-days: 30

  compare:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cinelux-ota-metadata-*
          merge-multiple: true
          path: /tmp/ota-metadata
      - name: Publish firmware-version inspection of both variants
        run: |
          mkdir -p analysis/OTA_Versions
          cp /tmp/ota-metadata/one/version_inventory.json analysis/OTA_Versions/one.json
          cp /tmp/ota-metadata/two/version_inventory.json analysis/OTA_Versions/two.json
          {
            echo "# CineLux OTA version audit (1 HDMI and 2 HDMI)"
            echo
            echo "This static scan cannot prove the vendor OTA version if it is assigned by a live OTA server or device-private NVRAM."
            echo
            cat /tmp/ota-metadata/one/README.md
            echo
            echo "---"
            echo
            cat /tmp/ota-metadata/two/README.md
          } > analysis/OTA_Versions/README.md
      - name: Commit compact version metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/OTA_Versions/
          if ! git diff --cached --quiet; then
            git commit -m "Compare OEM/OTA firmware version markers across both CineLux releases"
            git pull --rebase origin main
            git push origin main
          fi
